name: Daily stock signal update

on:
  schedule:
    # 毎日16:30 JST
    - cron: "30 16 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch: {}

jobs:
  fetch-and-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show trigger time
        run: |
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          TZ=Asia/Tokyo date '+JST: %Y-%m-%d %H:%M:%S'
          echo "event: ${{ github.event_name }}"
          echo "schedule: ${{ github.event.schedule }}"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetch and signal script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_and_signal.py

      - name: Fetch market news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_news.py
