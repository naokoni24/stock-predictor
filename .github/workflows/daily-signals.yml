name: Daily stock signal update

on:
  schedule:
    # 毎日11:37 JST (UTC 02:37) に実行(2026-09-07変更)。
    # 東証の取引終了(15:00 JST)より前なので、scripts/fetch_and_signal.py側の
    # 安全策(MARKET_CLOSE_HOUR_JST、取引終了前は当日分を除外)が働く前提の設定。
    # 経緯: 2026-08-18時点では「取引終了時刻を基準に、遅延はコード側の安全策で吸収する」
    # 方針で15:30/15:37 JSTに設定していたが、2026-09-04〜06の3日間で実測した結果、
    # GitHub Actions scheduleイベント自体の遅延が恒常的に4〜6時間規模(19:52〜21:21 JST発火)
    # と判明し、分をキリの良い時刻から外す対策(2026-09-04)でも改善しなかった。
    # 遅延を見込んで大きく前倒しても、上記の安全策により「取引中の暫定値を当日終値として
    # 保存する」事故は起きないため、6時間の遅延を見込んで11:37 JSTへ前倒し
    # (それでも遅延が縮小すれば15:00 JST過ぎに正常発火する可能性もある)。
    - cron: "37 2 * * *"
    # 通常更新で終値が欠損・未更新だった銘柄だけを13:37 JST (UTC 04:37) に再取得する
    # (2026-09-07、17:12→13:37に前倒し。理由は本実行と同じ)。
    # 同じ全銘柄処理を繰り返さず無料枠消費を抑える。
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      repair_only:
        description: "欠損銘柄だけ再取得する修復モードで実行するか('1'で有効)"
        type: choice
        options: ["0", "1"]
        default: "0"

# scheduleの通常実行/修復実行と、Vercel Cron監視からのworkflow_dispatchが
# 万一重なっても同時実行せず直列化する(2026-09-03追加)。
concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  fetch-and-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show trigger time
        run: |
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          TZ=Asia/Tokyo date '+JST: %Y-%m-%d %H:%M:%S'
          echo "event: ${{ github.event_name }}"
          echo "schedule: ${{ github.event.schedule }}"
          echo "repair_only input: ${{ github.event.inputs.repair_only }}"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetch and signal script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPAIR_MISSING_CLOSES_ONLY: ${{ (github.event.schedule == '0 8 * * *' || github.event.inputs.repair_only == '1') && '1' || '0' }}
        run: python scripts/fetch_and_signal.py

      - name: Evaluate live AI signal outcomes
        if: github.event.schedule != '0 8 * * *' && github.event.inputs.repair_only != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/evaluate_signal_outcomes.py

      - name: Fetch market news
        if: github.event.schedule != '0 8 * * *' && github.event.inputs.repair_only != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_news.py

      - name: Apply retention policy
        if: github.event.schedule != '0 8 * * *' && github.event.inputs.repair_only != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/apply_retention.py
