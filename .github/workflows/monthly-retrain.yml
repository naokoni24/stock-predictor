name: Monthly model retrain

on:
  schedule:
    # 毎月1日 7:00 JST (UTC 22:00)
    - cron: "0 22 1 * *"
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Retrain model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/train_model.py

      - name: Commit updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # model.pklに加え、モデル世代アンサンブル用のmodel_gen1.pkl/model_gen2.pkl
          # (昇格時のみrotate_model_generationsが作成・更新する)も対象に含める。
          # 初回導入直後はgen1/gen2がまだ存在しないため、存在するファイルだけ追加する。
          for f in scripts/model.pkl scripts/model_gen1.pkl scripts/model_gen2.pkl; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "model unchanged, skip commit"
          else
            git commit -m "monthly retrain: update model.pkl"
            git push
          fi
