name: Monthly model retrain

on:
  schedule:
    # 毎月1日 7:00 JST (UTC 22:00)
    - cron: "0 22 1 * *"
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Retrain model
        run: python scripts/train_model.py

      - name: Commit updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- scripts/model.pkl; then
            echo "model.pkl unchanged, skip commit"
          else
            git add scripts/model.pkl
            git commit -m "monthly retrain: update model.pkl"
            git push
          fi
