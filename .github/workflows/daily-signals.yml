name: Daily stock signal update

on:
  schedule:
    # 毎日10:37 JST (UTC 01:37) に実行(2026-09-07に11:37へ、2026-09-26にユーザー依頼で11:07→10:37へ計1時間前倒し)。
    # 東証の取引終了(15:00 JST)より前なので、scripts/fetch_and_signal.py側の
    # 安全策(MARKET_CLOSE_HOUR_JST、取引終了前は当日分を除外)が働く前提の設定。
    # 経緯: 2026-08-18時点では「取引終了時刻を基準に、遅延はコード側の安全策で吸収する」
    # 方針で15:30/15:37 JSTに設定していたが、2026-09-04〜06の3日間で実測した結果、
    # GitHub Actions scheduleイベント自体の遅延が恒常的に4〜6時間規模(19:52〜21:21 JST発火)
    # と判明し、分をキリの良い時刻から外す対策(2026-09-04)でも改善しなかった。
    # 遅延を見込んで大きく前倒しても、上記の安全策により「取引中の暫定値を当日終値として
    # 保存する」事故は起きないため、6時間の遅延を見込んで11:37 JSTへ前倒し
    # (それでも遅延が縮小すれば15:00 JST過ぎに正常発火する可能性もある)。
    - cron: "37 1 * * *"
    # 通常更新で終値が欠損・未更新だった銘柄だけを12:37 JST (UTC 03:37) に再取得する
    # (2026-09-07、17:12→13:37に前倒し。2026-09-26にさらに1時間前倒し。理由は本実行と同じ)。
    # 同じ全銘柄処理を繰り返さず無料枠消費を抑える。本実行が取引終了前に発火して
    # 当日分を処理できていない場合は、スクリプト側で通常モードへ切り替わる。
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      repair_only:
        description: "欠損銘柄だけ再取得する修復モードで実行するか('1'で有効)"
        type: choice
        options: ["0", "1"]
        default: "0"

# scheduleの通常実行/修復実行と、Vercel Cron監視からのworkflow_dispatchが
# 万一重なっても同時実行せず直列化する(2026-09-03追加)。
concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  fetch-and-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show trigger time
        run: |
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          TZ=Asia/Tokyo date '+JST: %Y-%m-%d %H:%M:%S'
          echo "event: ${{ github.event_name }}"
          echo "schedule: ${{ github.event.schedule }}"
          echo "repair_only input: ${{ github.event.inputs.repair_only }}"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # スケジュール実行は2本とも修復モード(REPAIR_MISSING_CLOSES_ONLY=1)で起動し、
      # 直近の市場日のシグナルが未保存ならスクリプト側で通常モードへ切り替える
      # (2026-09-26変更)。以前は修復実行の判定が旧cron('0 8 * * *')のまま残っており、
      # 2本目も毎回通常モードで全銘柄を再処理していた。さらに土日祝のスケジュール実行も
      # 直前営業日を通常モードで再処理しており、日ごとにユニバースが変わるため、
      # 同じ市場日のAI買い候補が上限20件を超えていた。
      # 手動実行(workflow_dispatch)でrepair_only='0'を指定した場合だけ強制的に通常モード。
      - name: Run fetch and signal script
        id: signal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPAIR_MISSING_CLOSES_ONLY: ${{ (github.event_name == 'schedule' || github.event.inputs.repair_only == '1') && '1' || '0' }}
        run: python scripts/fetch_and_signal.py

      # 実績評価・ニュース取得・保持期間処理は、本実行スケジュール(土日もニュース取得を
      # 続けるため)か、通常モードで全銘柄を処理した実行でだけ行う。
      - name: Evaluate live AI signal outcomes
        if: github.event.schedule == '37 1 * * *' || steps.signal.outputs.mode == 'full'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/evaluate_signal_outcomes.py

      - name: Fetch market news
        if: github.event.schedule == '37 1 * * *' || steps.signal.outputs.mode == 'full'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_news.py

      - name: Apply retention policy
        if: github.event.schedule == '37 1 * * *' || steps.signal.outputs.mode == 'full'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/apply_retention.py
