name: Daily stock signal update

on:
  schedule:
    # 毎日15:37 JST (UTC 06:37)。東証の取引終了(15:00 JST)より後に設定し、
    # 当日終値が確定してから取得する。以前は13:00 JST(取引時間中)に実行しており
    # 当日分が未確定の暫定値のまま「当日終値」として保存され、ポートフォリオの
    # 評価額が実際の当日終値と一致しない不具合の原因になっていた(2026-08-18)。
    # なお、直近の実行実績ではGitHub Actionsのスケジュール遅延は30〜40分程度。
    # scripts/fetch_and_signal.py側にも取引終了前は当日分を除外する安全策を追加済み。
    # 分は元々:30(キリの良い分、混雑しやすいとGitHub公式が案内)だったが、
    # 2026-09-04にscheduleイベントが2回とも未発火する事象が発生したため:37へ変更。
    # 効果は次回以降の発火状況を見て2026-09-08週に再調整する。
    - cron: "37 6 * * *"
    # 通常更新で終値が欠損・未更新だった銘柄だけを17:12 JST (UTC 08:12) に再取得する
    # (2026-09-03、18:45→17:00に短縮。本実行との間隔を詰めて遅延からの回収を早める。
    # 2026-09-04、17:00(毎時ちょうど、GitHub公式が高負荷になりやすいと案内する
    # 時間帯)から17:12へ変更)。17:12も取引終了(15:00 JST)より後なので
    # scripts/fetch_and_signal.py側の安全策(MARKET_CLOSE_HOUR_JST)の範囲内。
    # 同じ全銘柄処理を繰り返さず無料枠消費を抑える。
    - cron: "12 8 * * *"
  workflow_dispatch:
    inputs:
      repair_only:
        description: "欠損銘柄だけ再取得する修復モードで実行するか('1'で有効)"
        type: choice
        options: ["0", "1"]
        default: "0"

# scheduleの通常実行/修復実行と、Vercel Cron監視からのworkflow_dispatchが
# 万一重なっても同時実行せず直列化する(2026-09-03追加)。
concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  fetch-and-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show trigger time
        run: |
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          TZ=Asia/Tokyo date '+JST: %Y-%m-%d %H:%M:%S'
          echo "event: ${{ github.event_name }}"
          echo "schedule: ${{ github.event.schedule }}"
          echo "repair_only input: ${{ github.event.inputs.repair_only }}"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetch and signal script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPAIR_MISSING_CLOSES_ONLY: ${{ (github.event.schedule == '0 8 * * *' || github.event.inputs.repair_only == '1') && '1' || '0' }}
        run: python scripts/fetch_and_signal.py

      - name: Evaluate live AI signal outcomes
        if: github.event.schedule != '0 8 * * *' && github.event.inputs.repair_only != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/evaluate_signal_outcomes.py

      - name: Fetch market news
        if: github.event.schedule != '0 8 * * *' && github.event.inputs.repair_only != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_news.py

      - name: Apply retention policy
        if: github.event.schedule != '0 8 * * *' && github.event.inputs.repair_only != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/apply_retention.py
