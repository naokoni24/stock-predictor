name: Daily stock signal update

on:
  schedule:
    # 毎日15:30 JST (UTC 06:30)。東証の取引終了(15:00 JST)より後に設定し、
    # 当日終値が確定してから取得する。以前は13:00 JST(取引時間中)に実行しており
    # 当日分が未確定の暫定値のまま「当日終値」として保存され、ポートフォリオの
    # 評価額が実際の当日終値と一致しない不具合の原因になっていた(2026-08-18)。
    # なお、直近の実行実績ではGitHub Actionsのスケジュール遅延は30〜40分程度。
    # scripts/fetch_and_signal.py側にも取引終了前は当日分を除外する安全策を追加済み。
    - cron: "30 6 * * *"
    # 通常更新で終値が欠損・未更新だった銘柄だけを18:45 JST (UTC 09:45) に再取得する。
    # 同じ全銘柄処理を繰り返さず、GitHub Actions無料枠の消費を抑える。
    - cron: "45 9 * * *"
  workflow_dispatch: {}

jobs:
  fetch-and-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show trigger time
        run: |
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          TZ=Asia/Tokyo date '+JST: %Y-%m-%d %H:%M:%S'
          echo "event: ${{ github.event_name }}"
          echo "schedule: ${{ github.event.schedule }}"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetch and signal script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPAIR_MISSING_CLOSES_ONLY: ${{ github.event.schedule == '45 9 * * *' && '1' || '0' }}
        run: python scripts/fetch_and_signal.py

      - name: Evaluate live AI signal outcomes
        if: github.event.schedule != '45 9 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/evaluate_signal_outcomes.py

      - name: Fetch market news
        if: github.event.schedule != '45 9 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_news.py

      - name: Apply retention policy
        if: github.event.schedule != '45 9 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/apply_retention.py
